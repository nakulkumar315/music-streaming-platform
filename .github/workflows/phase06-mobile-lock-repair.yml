name: Phase 06 Mobile Lock Repair

on:
  push:
    branches:
      - fix/phase-06-mobile-fan-hardening

permissions:
  contents: write

jobs:
  regenerate-mobile-lock:
    if: contains(github.event.head_commit.message, '[regen-mobile-lock]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Phase 06 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Remove legacy client entitlement navigation hint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/fan/src/screens/SubscriptionFlowScreen.tsx')
          text = path.read_text()
          old = '      unlocked: true,\n'

          if old in text:
              text = text.replace(old, '', 1)
              path.write_text(text)
          elif 'unlocked: true' in text:
              raise SystemExit('Unexpected unlocked:true formatting; refusing an unsafe blind edit')

          if 'unlocked: true' in path.read_text():
              raise SystemExit('Client entitlement navigation hint still present')
          PY

      - name: Regenerate npm lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Run mobile verification
        run: npm run verify

      - name: Commit verified hardening outputs when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json apps/fan/src/screens/SubscriptionFlowScreen.tsx; then
            echo "Generated outputs already match the verified source state"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/fan/src/screens/SubscriptionFlowScreen.tsx
          git commit -m "Phase 06: verify mobile dependencies and entitlement navigation"
          git push origin HEAD:fix/phase-06-mobile-fan-hardening
