name: Phase 06 Mobile Lock Repair

on:
  push:
    branches:
      - fix/phase-06-mobile-fan-hardening

permissions:
  contents: write

jobs:
  regenerate-mobile-lock:
    if: contains(github.event.head_commit.message, '[regen-mobile-lock]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Phase 06 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate npm lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Run mobile verification
        run: npm run verify

      - name: Commit regenerated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Phase 06: regenerate mobile dependency lock"
          git push origin HEAD:fix/phase-06-mobile-fan-hardening
